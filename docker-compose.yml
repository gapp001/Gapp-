version: '3.5'

services:
  # stellar_ms_web:
  #   build: .
  #   container_name: stellar_ms_web
  #   command: uvicorn application.main:app
  #   env_file:
  #     - ./.env
  #   expose:
  #     - 8000
  #   restart: always

  stellar_ms_redis:
    container_name: stellar_ms_redis
    command: redis-server /usr/local/etc/redis/redis.conf
    image: redis:6-alpine
    volumes:
      - ./redis/data:/redis/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
      - ./redis/log:/root/redis/log
    logging:
      options:
        max-size: 10m
    expose:
      - 6379
    restart: always

  stellar_ms_celery:
    build: .
    image: stellar_ms
    container_name: stellar_ms_celery
    command: bash -c "celery -A conf worker -l INFO"
    env_file:
      - ./.env
    depends_on:
      - stellar_ms_redis
    restart: always
    logging:
      options:
        max-size: 10m

  stellar_ms_celery-beat:
    image: stellar_ms
    container_name: stellar_ms_celery-beat
    command: celery -A conf beat -l INFO
    env_file:
      - ./.env
    depends_on:
      - stellar_ms_redis
      - stellar_ms_celery
    restart: always
    logging:
      options:
        max-size: 10m
